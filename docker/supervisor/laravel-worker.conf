[program:laravel-worker]
process_name=%(program_name)s
command=php /app/artisan queue:work redis --queue=default,image-processing,post_notifications,sport-rank-notifications --verbose --tries=1
directory=/app
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
user=root

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stderr_logfile_backups=0